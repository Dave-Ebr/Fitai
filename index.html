function bindDynamic(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.reward)reward(b.dataset.reward);go(b.dataset.page)});renderStats()}
function renderPlans(){const p=workout?.plan_data;let days=Array.isArray(p)?p:(p?.days||p?.weekly_plan||p?.workouts||[]);if(!Array.isArray(days))days=[];$('workout').innerHTML=`<div class="pagehead"><div><div class="eyebrow">برنامه شخصی</div><h2>تمرین امروز ⚡</h2></div><span class="tag">AI GENERATED</span></div>${days.length?'<div class="grid">'+days.map((d,i)=>{const ex=d.exercises||d.workout||[];return '<div class="card"><div class="eyebrow">روز '+(i+1)+'</div><h3>'+esc(d.day_name||d.day||d.title||'جلسه تمرینی')+'</h3>'+(Array.isArray(ex)?ex.map(e=>'<div class="exercise"><span>'+esc(e.name||e.exercise||'تمرین')+'</span><small>'+esc(e.sets||'—')+' ست × '+esc(e.reps||'—')+'</small></div>').join(''):'<p>'+esc(ex)+'</p>')+'</div>'}).join('')+'</div>':'<div class="empty">هنوز برنامه تمرینی فعالی پیدا نشد.</div>'}`;
const n=nutrition?.plan_data;let meals=n?.meals||n?.daily_plan||n?.days||[];if(!Array.isArray(meals))meals=[];$('nutrition').innerHTML=`<div class="pagehead"><div><div class="eyebrow">سوخت بدن</div><h2>برنامه تغذیه 🥗</h2></div></div>${meals.length?'<div class="grid">'+meals.map((m,i)=>'<div class="card"><div class="eyebrow">وعده '+(i+1)+'</div><h3>'+esc(m.name||m.meal||'وعده غذایی')+'</h3><p>'+esc(m.description||m.foods||m.items||'')+'</p><small>'+esc(m.calories?m.calories+' kcal':'')+'</small></div>').join('')+'</div>':'<div class="empty">هنوز برنامه تغذیه فعالی پیدا نشد.</div>'}`}
function profilePage(){const p=profile||{};$('profile').innerHTML=`<div class="pagehead"><div><div class="eyebrow">پروفایل</div><h2>اطلاعات من</h2></div></div><div class="profile"><dl><dt>نام<dd>${esc(p.full_name||'—')}</dd></dt><dt>سن<dd>${esc(p.age||'—')} سال</dd></dt><dt>قد<dd>${esc(p.height_cm||'—')} cm</dd></dt><dt>وزن<dd>${esc(p.weight_kg||'—')} kg</dd></dt><dt>هدف<dd>${esc(goals[p.fitness_goal]||'—')}</dd></dt><dt>سطح<dd>${esc(p.experience_level||'—')}</dd></dt><dt>روز تمرین<dd>${esc(p.training_days_per_week||'—')} روز</dd></dt><dt>کالری هدف<dd>${p.target_calories?Math.round(p.target_calories):'—'}</dd></dt></dl></div>`}
function coachPage(){$('coach').innerHTML=`<div class="coach"><div class="coachhead"><div class="coachavatar">AI</div><div><h2>مربی FITAI</h2><p>بر اساس برنامه و وضعیت بدنت جواب می‌دهم.</p></div><span class="online">● آنلاین</span></div><div id="messages" class="messages"><div class="bubble ai">سلام قهرمان! 💪\nمن مربی هوشمندتم. درباره تمرین، تغذیه یا روند پیشرفتت هر چیزی خواستی بپرس.</div></div><form id="chatForm" class="chatform"><input id="chatInput" maxlength="2000" placeholder="مثلاً: برای افزایش حجم امروز چه کار کنم؟" autocomplete="off"><button class="primary" type="submit">➤</button></form><div class="suggest"><button>امروز چی تمرین کنم؟</button><button>پروتئینم چقدر باشه؟</button><button>اگر تمرین را از دست دادم؟</button></div></div>`;$('chatForm').onsubmit=e=>{e.preventDefault();const i=$('chatInput'),v=i.value;i.value='';sendChat(v)};document.querySelectorAll('.suggest button').forEach(b=>b.onclick=()=>sendChat(b.textContent))}
async function n8n(path,body){if(!session)throw Error('جلسه ورود منقضی شده است.');const r=await fetch(CONFIG.N8N+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||'خطا در ارتباط با سرور');return d}
async function sendChat(text){if(!text.trim())return;const box=$('messages');const u=document.createElement('div');u.className='bubble user';u.textContent=text;box.appendChild(u);box.scrollTop=box.scrollHeight;const a=document.createElement('div');a.className='bubble ai';a.textContent='در حال فکر کردن...';box.appendChild(a);try{const d=await n8n('/fitai/chat',{message:text,conversation_id:localStorage.getItem('fitai_conversation_id')||null});a.textContent=d.reply||d.response||'پاسخی دریافت نشد.';if(d.conversation_id)localStorage.setItem('fitai_conversation_id',d.conversation_id);reward('chat')}catch(e){a.textContent='خطا: '+e.message}box.scrollTop=box.scrollHeight}
function onboarding(){let s=1;const render=()=>{$('onboard').innerHTML=`<div class="onboard"><div class="steps"><div class="step ${s>=1?'active':''}">1</div><div class="step-line"></div><div class="step ${s>=2?'active':''}">2</div><div class="step-line"></div><div class="step ${s>=3?'active':''}">3</div></div><div id="os"></div></div>`;const o=$('os');if(s===1)o.innerHTML=`<div class="eyebrow">مرحله ۱ از ۳</div><h2>بدنت را به من معرفی کن</h2><p>برای ساخت برنامه دقیق، چند اطلاعات پایه لازم دارم.</p><div class="formgrid"><label>سن<input id="age" type="number" min="13" max="90"></label><label>قد (cm)<input id="height" type="number" min="100" max="240"></label><label>وزن (kg)<input id="weight" type="number" min="30" max="250"></label><label>جنسیت<select id="gender"><option value="male">مرد</option><option value="female">زن</option><option value="other">ترجیح می‌دهم نگویم</option></select></label></div><div class="actions"><span></span><button id="next1" class="primary">ادامه →</button></div>`;else if(s===2)o.innerHTML=`<div class="eyebrow">مرحله ۲ از ۳</div><h2>هدفت چیست؟</h2><p>یک هدف اصلی انتخاب کن.</p><div class="goals">${Object.entries(goals).map(([k,v])=>`<button class="goal ${goal===k?'selected':''}" data-goal="${k}">${{muscle_gain:'💪',fat_loss:'🔥',recomposition:'⚖️',strength:'🏋️',general_fitness:'🏃'}[k]}<strong>${v}</strong><small>برنامه متناسب با هدف</small></button>`).join('')}</div><div class="actions"><button id="back2" class="secondary">← قبلی</button><button id="next2" class="primary">ادامه →</button></div>`;else o.innerHTML=`<div class="eyebrow">مرحله ۳ از ۳</div><h2>سبک تمرینت را مشخص کن</h2><p>آخرین اطلاعات برای ساخت برنامه.</p><div class="formgrid"><label>سطح تجربه<select id="experience"><option value="beginner">مبتدی</option><option value="intermediate">متوسط</option><option value="advanced">پیشرفته</option></select></label><label>روز تمرین در هفته<input id="days" type="number" min="1" max="7" value="4"></label><label>مدت جلسه (دقیقه)<input id="duration" type="number" min="20" max="180" value="60"></label><label>نوع رژیم<select id="diet"><option value="omnivore">همه‌چیزخوار</option><option value="vegetarian">گیاهخواری</option><option value="vegan">وگان</option></select></label></div><label>تجهیزات<input id="equipment" placeholder="مثلاً باشگاه کامل، دمبل، کش"></label><label>آسیب‌دیدگی یا محدودیت<input id="injuries" placeholder="اگر ندارید خالی بگذارید"></label><div class="actions"><button id="back3" class="secondary">← قبلی</button><button id="generate" class="primary">ساخت برنامه من 🚀</button></div>`;
if(s===1)$('next1').onclick=()=>{if(!+$('age').value||!+$('height').value||!+$('weight').value)return toast('سن، قد و وزن را کامل کن.');s=2;render()};if(s===2){document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{goal=b.dataset.goal;render()});$('back2').onclick=()=>{s=1;render()};$('next2').onclick=()=>{if(!goal)return toast('یک هدف انتخاب کن.');s=3;render()}}if(s===3){$('back3').onclick=()=>{s=2;render()};$('generate').onclick=generatePlan}};render()}
async function generatePlan(){const body={full_name:profile?.full_name||session.user.user_metadata?.full_name||'کاربر FITAI',age:+$('age').value,height_cm:+$('height').value,weight_kg:+$('weight').value,gender:$('gender').value,fitness_goal:goal,experience_level:$('experience').value,training_days_per_week:+$('days').value,session_duration_minutes:+$('duration').value,diet_type:$('diet').value,equipment:$('equipment').value.split(',').map(x=>x.trim()).filter(Boolean),injuries:$('injuries').value?[ $('injuries').value ]:[]};$('generate').disabled=true;$('generate').textContent='در حال ساخت برنامه... ✨';try{await n8n('/fitai/generate-plan',body);toast('برنامه اختصاصی تو ساخته شد! 🚀');await getData();$('onboard').innerHTML='';dashboard();renderPlans();profilePage();go('home')}catch(e){toast(e.message)}finally{$('generate').disabled=false;$('generate').textContent='ساخت برنامه من 🚀'}}
async function start(){const r=await sb.auth.getSession();session=r.data.session;if(!session){auth();return}document.getElementById('root').innerHTML=shell();layout();try{await getData();$('avatar').textContent=(profile?.full_name||'F').trim()[0]?.toUpperCase()||'F';dashboard();renderPlans();coachPage();profilePage();if(!profile?.onboarding_completed)onboarding()}catch(e){toast('خطا در بارگذاری اطلاعات: '+e.message)}}
sb.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){session=null;auth()}else if(event==='SIGNED_IN'){session=s;setTimeout(start,0)}});start();
</script></body></html>
